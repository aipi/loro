# Loro — CI
#
# Runs the test suite and quality gates for the Tauri v2 desktop app:
#   - Rust backend  (desktop/src-tauri, crate `desktop`)
#   - Vanilla JS frontend tests (desktop/tests, run with the Node test runner)
#
# `test` covers all three desktop platforms Loro ships on. Windows was added
# after four tests went red there unnoticed for a while (sha256_of/
# verify_and_install using shasum/sha256sum, pty_opens_spawns_and_exits using
# /bin/sh) — CI had no runner to catch it. Every step below either already
# runs the same cargo/node commands on every OS, or is explicitly scoped with
# `if: matrix.os == '…'` to the one platform it needs; there is no Makefile
# recipe here to begin with (make requires a POSIX shell Windows does not have).
#
# The GUI bundle is NOT built here (that is a release concern). `build-check`
# only compiles the backend to guarantee it still builds.
name: CI

on:
  push:
  pull_request:

jobs:
  # Test + lint + format across Linux, macOS and Windows.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Tauri v2 Linux build dependencies (webkit2gtk / gtk / soup / alsa / ssl).
      # macOS ships the required system frameworks, so this step is Linux-only.
      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libasound2-dev \
            pkg-config \
            build-essential

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The macOS bundle declares syscap/loro-syscap as a resource
      # (tauri.macos.conf.json), so the Tauri build script requires the
      # binary to exist before any cargo build/test on macOS (ADR-0005).
      - name: Compile syscap (macOS)
        if: matrix.os == 'macos-latest'
        run: make syscap

      - name: Rust backend tests
        working-directory: desktop/src-tauri
        run: cargo test

      # A bare glob arg here relies on the SHELL to expand it. bash (Linux/macOS
      # runners) does; pwsh (the default shell on windows-latest) does not, and
      # passes the literal string through — MEASURED in CI: "Could not find
      # 'D:\a\loro\loro\desktop\tests\*.test.js'", exit 1 for the wrong reason
      # (the step never ran a single test). A directory as the CLI arg is not
      # a fix either — MEASURED locally: `node --test desktop/tests` throws
      # "Cannot find module …\desktop\tests" (this Node CLI resolves a bare
      # positional path as a module to require, not a dir to scan). Dropping
      # the argument and running from inside the dir lets Node's own default
      # test-file discovery do the walk — no glob, no shell involved either way.
      - name: JS frontend tests
        working-directory: desktop/tests
        run: node --test

      - name: Clippy (deny warnings)
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml -- -D warnings

      - name: Rustfmt check
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check

  # Sanity build of the backend crate (no GUI bundle) to confirm it compiles.
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libasound2-dev \
            pkg-config \
            build-essential

      - name: Build backend (no bundle)
        run: cargo build --manifest-path desktop/src-tauri/Cargo.toml
