# Loro — Release
#
# Two ways in, one builder (ADR-0015):
#   1. Merge a `release/*` PR into main — the release PR only bumps the version
#      (open it with `make release VERSION=x.y.z`). Merging it ships automatically.
#   2. Push a tag `v*` on main — the manual escape hatch.
# Either way this job builds the macOS .dmg and publishes a GitHub Release; the
# tag is `v<version>` and is created by `gh release create` when it doesn't exist.
#
# The bundle is NOT signed with an Apple Developer ID (owner decision,
# 2026-07-28). On macOS 15+ Gatekeeper blocks unsigned quarantined apps
# outright — misreporting them as "damaged" — and right-click → Open no
# longer bypasses it; the only reliable path is removing the quarantine
# attribute. The release notes carry that instruction.
#
# Gates (loro-release-checklist §1): tests, clippy and fmt must pass, and on the
# tag path the tag must match tauri.conf.json — no drift between git and app.
name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    # Tag pushes always build. A PR build runs ONLY when a `release/*` branch was
    # actually merged (not merely closed) — so ordinary PRs never ship.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # On the PR path, build the merge commit that landed on main (it carries
          # the version bump); on the tag path, the tagged commit.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve version and tag
        id: ver
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])")
          # On the tag path, enforce that the tag matches the app version — no
          # drift between git and the bundle (loro-release-checklist §1).
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$VERSION" != "$TAG_VERSION" ]; then
              echo "::error::tag v$TAG_VERSION does not match tauri.conf.json version $VERSION"
              exit 1
            fi
          fi
          # Refuse to re-release an existing version (a stale release PR, a rerun).
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::release v$VERSION already exists — bump the version"
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Compile syscap (macOS system-audio capturer)
        run: make syscap

      - name: Test gate
        run: |
          cargo test --manifest-path desktop/src-tauri/Cargo.toml
          node --test desktop/tests/*.test.js
          cargo clippy --manifest-path desktop/src-tauri/Cargo.toml -- -D warnings
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build app bundle (.app + .dmg)
        working-directory: desktop
        run: npm run tauri build

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG=$(ls desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          gh release create "${{ steps.ver.outputs.tag }}" "$DMG" \
            --target "${{ github.event.pull_request.merge_commit_sha || github.sha }}" \
            --title "Loro ${{ steps.ver.outputs.tag }}" \
            --generate-notes \
            --notes "**Instalação recomendada (macOS, Apple Silicon):** \`brew tap aipi/loro && brew install --cask loro\` — instala o app + o motor (whisper-cpp, ffmpeg). Os modelos de transcrição são baixados sob demanda no primeiro uso (Configurações → modelo), verificados por SHA-256. **Alternativa manual:** baixe o \`.dmg\` e arraste o Loro para Aplicativos; o app não é assinado com Developer ID, então no macOS 15+ pode ser preciso liberar com \`xattr -d com.apple.quarantine /Applications/Loro.app\`."

      # Opção A (ADR-0006): after the release exists, render the cask from the
      # in-repo template (single source of truth) and push it to the tap repo so
      # `brew upgrade --cask loro` picks up this version. Requires the TAP_TOKEN
      # secret — a fine-grained PAT with Contents:write scoped ONLY to
      # aipi/homebrew-loro. If the secret is absent the step is skipped (the
      # GitHub Release still publishes); the maintainer bumps the cask manually.
      - name: Bump Homebrew cask in tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "TAP_TOKEN not set — skipping cask bump (release still published)"
            exit 0
          fi
          VERSION="${{ steps.ver.outputs.version }}"
          DMG=$(ls desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          SHA=$(shasum -a 256 "$DMG" | awk '{print $1}')
          echo "cask bump: loro $VERSION ($SHA)"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/aipi/homebrew-loro.git" tap
          mkdir -p tap/Casks
          sed -e "s/__VERSION__/${VERSION}/g" -e "s/__SHA256__/${SHA}/g" \
            packaging/homebrew/loro.rb.tmpl > tap/Casks/loro.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "cask already up to date"; exit 0; fi
          git add Casks/loro.rb
          git commit -m "loro ${VERSION}"
          git push
