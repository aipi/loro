[package]
name = "desktop"
version = "0.14.1"
description = "Loro — local live speech-to-text and knowledge base"
authors = ["Loro"]
edition = "2021"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
portable-pty = "0.9.0"

# Windows has no `ps`, and `wmic` was removed from Windows 11, so the terminal's
# process tree is read straight from the ToolHelp snapshot API (ADR-0023, the
# decision drafted as 0013). Already
# in the tree as a transitive Tauri dependency, so this adds no build cost.
[target.'cfg(windows)'.dependencies]
# Meeting mode on Windows captures the system audio through WASAPI loopback
# (ADR-0033). The full `windows` crate is already in the tree via Tauri, so the
# COM interfaces cost feature flags and no new download.
windows = { version = "0.61", features = [
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
] }
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
] }
