<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 10 90 90">
  <!-- silhueta do Adalto p/ barra de menu (template: só o alpha importa).
       Branco na máscara = tinta; preto = vazado (olho, asa, contorno do bico). -->
  <defs>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <g fill="#fff">
        <path d="M36 62 L9 90 Q6 95 12 94 L46 76 Z"/>
        <ellipse cx="47" cy="54" rx="17" ry="25" transform="rotate(-22 47 54)"/>
        <circle cx="60" cy="29" r="15"/>
      </g>
      <g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M44 76 L39 91 H49"/>
        <path d="M55 73 L63 87 H73"/>
      </g>
      <path d="M71 20 C84 18 90 30 84 40 C81 44 76 44 74 41 C78 37 77 31 71 30 Z" fill="#fff" stroke="#000" stroke-width="3.5" stroke-linejoin="round"/>
      <!-- olho de bravo: meia-lua inclinada -->
      <path d="M57 26 A6 6 0 0 0 69 26 Z" fill="#000" transform="rotate(20 63 26)"/>
      <!-- asa -->
      <path d="M36 45 Q33 62 47 68" fill="none" stroke="#000" stroke-width="4.5" stroke-linecap="round"/>
    </mask>
  </defs>
  <rect x="0" y="0" width="100" height="100" fill="#000000" mask="url(#m)"/>
</svg>
