<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loro</title>
    <!-- ADR-0041 — o balão de gravação. Recolhido: o ícone do app (32 pt por padrão;
         48 e 64 nas Configurações) com um selo ESTÁVEL no canto (● gravando, ❚❚
         pausado). Clicar abre o painel; apertar e arrastar move. O selo NUNCA anima
         nem pisca (pedido explícito do dono); a única transição é a do painel
         abrindo e fechando, curta e sem repetição. -->
    <style>
      :root {
        --icon: 32px; --pad: 6px; --badge: 10px;
        /* claro: superfície OPACA (dono, 2026-11-18: a translucidez deixava o texto
           das janelas de trás vazar por baixo das palavras), contraste AA medido */
        --bg: #f6f6f8; --bg-solid: #ffffff; --border: rgba(0, 0, 0, 0.14); --fg: #1d1d1f; --muted: #5f5f66;
        --line: rgba(0, 0, 0, 0.09); --chip: rgba(0, 0, 0, 0.05); --chip-on: rgba(0, 0, 0, 0.09);
        --ghost-hover: rgba(0, 0, 0, 0.06); --accent: #0f766e; --rec: #d70015; --rec-fg: #ffffff; --rec-text: #c00013;
        --now: rgba(215, 0, 21, 0.08); --shadow: 0 12px 32px rgba(0, 0, 0, 0.18), 0 0 0 0.5px rgba(0, 0, 0, 0.12);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #242428; --bg-solid: #2f2f34; --border: rgba(255, 255, 255, 0.14); --fg: #f5f5f7; --muted: #a8a8b0;
          --line: rgba(255, 255, 255, 0.10); --chip: rgba(255, 255, 255, 0.07); --chip-on: rgba(255, 255, 255, 0.16);
          --ghost-hover: rgba(255, 255, 255, 0.08); --accent: #5eead4; --rec: #d70015; --rec-text: #ff7b72;
          --now: rgba(255, 69, 58, 0.14); --shadow: 0 12px 32px rgba(0, 0, 0, 0.5), 0 0 0 0.5px rgba(255, 255, 255, 0.12);
        }
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; position: relative; background: transparent; overflow: hidden;
        font: 13px/1.38 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        color: var(--fg); user-select: none; -webkit-font-smoothing: antialiased; }
      button, select, input, textarea { font: inherit; color: inherit; }

      /* ---- o ícone ---- */
      #icon { position: absolute; left: var(--pad); top: var(--pad); width: var(--icon); height: var(--icon);
        border: 0; padding: 0; background: transparent; cursor: default; border-radius: 23%; z-index: 3;
        filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.3)); }
      /* o PNG tem os cantos claros: o recorte é aqui (medido no smoke) */
      #icon img { width: 100%; height: 100%; display: block; pointer-events: none; -webkit-user-drag: none;
        border-radius: 23%; }
      #icon:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      #badge { position: absolute; right: -3px; top: -3px; width: var(--badge); height: var(--badge);
        border-radius: 50%; border: 1.5px solid #fff; display: none; align-items: center; justify-content: center;
        font-size: calc(var(--badge) * 0.45); line-height: 1; color: #fff; font-weight: 700; }
      #badge.rec { display: flex; background: #e5484d; }
      #badge.pause { display: flex; background: #6e6e73; }
      #badge.pending { display: flex; background: #b9b2a3; }

      /* ---- o painel: cresce a partir do ícone, para o lado com mais espaço ---- */
      #panel { position: absolute; inset: 0; display: flex; flex-direction: column;
        background: var(--bg); border: 1px solid var(--border);
        border-radius: 14px; box-shadow: var(--shadow); overflow: hidden;
        visibility: hidden; opacity: 0; transform: scale(0.96); transform-origin: top left;
        transition: opacity 140ms ease-out, transform 140ms ease-out, visibility 0s linear 140ms; }
      body.open #panel { visibility: visible; opacity: 1; transform: none;
        transition: opacity 140ms ease-out, transform 140ms ease-out, visibility 0s; }
      body.anchor-right #panel { transform-origin: top right; }
      body.anchor-bottom #panel { transform-origin: bottom left; }
      body.anchor-right.anchor-bottom #panel { transform-origin: bottom right; }
      @media (prefers-reduced-motion: reduce) { #panel, body.open #panel { transition: none; } }
      body.anchor-right #icon { left: auto; right: var(--pad); }
      body.anchor-bottom #icon { top: auto; bottom: var(--pad); }

      #head { flex: none; display: flex; align-items: center; gap: 10px; min-height: calc(var(--icon) + 2 * var(--pad));
        padding: 8px 14px 6px calc(var(--icon) + var(--pad) + 12px); }
      body.anchor-right #head { padding: 8px calc(var(--icon) + var(--pad) + 12px) 6px 14px; }
      body.anchor-bottom #panel { flex-direction: column-reverse; }
      #head .txt { min-width: 0; flex: 1; }
      #bStatus { font-size: 11px; font-weight: 600; letter-spacing: 0.02em; color: var(--muted); display: flex; align-items: center; gap: 6px; }
      #bStatus .dot { width: 7px; height: 7px; border-radius: 50%; background: #e5484d; display: none; }
      body.rec #bStatus .dot { display: inline-block; }
      body.rec #bStatus { color: var(--rec-text); }
      body.paused #bStatus .dot { display: inline-block; background: #8e8e93; }
      #bTitle { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #bTime { font: 600 13px ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; flex: none; }

      #main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      #bPrompt { margin: 2px 12px 8px; padding: 10px 12px; border-radius: 10px; background: var(--chip); }
      #bPrompt[hidden] { display: none; }
      #bPrompt p { margin-bottom: 8px; font-weight: 500; }
      .tabs { display: flex; margin: 0 12px 8px; padding: 2px; border-radius: 8px; background: var(--chip); flex: none; }
      .tabs button { flex: 1; border: 0; background: transparent; padding: 4px 0; border-radius: 6px; font-size: 12px; font-weight: 500; color: var(--muted); }
      .tabs button[aria-selected="true"] { background: var(--bg-solid); color: var(--fg); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }
      .tab { flex: 1; min-height: 0; overflow-y: auto; padding: 0 12px 10px; display: flex; flex-direction: column; gap: 10px; }
      .tab[hidden] { display: none; }
      .lbl { font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }

      /* destino: um campo compacto que abre uma lista com busca (escala para muitas ideias) */
      .picker { position: relative; }
      .pickbtn { width: 100%; display: flex; align-items: center; gap: 6px; padding: 6px 9px; border-radius: 8px;
        border: 1px solid var(--line); background: var(--bg-solid); text-align: left; cursor: default; }
      .pickbtn:disabled { opacity: 0.6; }
      .pickname { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .pickcaret { flex: none; color: var(--muted); font-size: 10px; }
      .pickpop { margin-top: 4px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg-solid); padding: 4px; }
      .pickpop[hidden] { display: none; }
      .pickq { margin-bottom: 4px; }
      .picklist { list-style: none; max-height: 224px; overflow-y: auto; }
      .pickgrp { font-size: 11px; font-weight: 600; color: var(--muted); padding: 6px 8px 2px; }
      .pickit { padding: 5px 8px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default; height: 28px; }
      .pickit[aria-selected="true"] { background: var(--accent); color: var(--bg-solid); }
      .pickit.new { font-weight: 600; }
      select, input[type="text"], textarea { width: 100%; padding: 6px 9px; border-radius: 8px; border: 1px solid var(--line);
        background: var(--bg-solid); user-select: text; outline: none; }
      select:focus-visible, input:focus-visible, textarea:focus-visible, .btn:focus-visible, .chip:focus-visible, .tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

      .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
      .btn { border: 0; padding: 6px 12px; border-radius: 8px; background: transparent; cursor: default; font-weight: 500; }
      .btn.ghost { background: var(--chip); }
      .btn.ghost:hover { background: var(--ghost-hover); }
      .btn.primary { background: var(--rec); color: var(--rec-fg); font-weight: 600; padding: 7px 16px; }
      .btn.primary:hover { filter: brightness(1.08); }
      .btn.link { padding: 2px 4px; color: var(--muted); font-size: 12px; }
      .btn[hidden] { display: none; }
      #bAviso { font-size: 12px; color: var(--rec-text); }
      #bAviso:empty { display: none; }

      #bTail { min-height: 56px; max-height: 160px; overflow-y: auto; padding: 8px 10px; border-radius: 10px;
        background: var(--chip); font-size: 12px; user-select: text; display: flex; flex-direction: column; gap: 4px; }
      #bTail .who { font-weight: 600; color: var(--accent); margin-right: 5px; }
      #bTail .who.sistema { color: var(--muted); }
      #bTail:empty::before { content: attr(data-empty); color: var(--muted); }

      /* agenda */
      #bAgenda, #bPassados ul { list-style: none; display: flex; flex-direction: column; gap: 2px; }
      .grp { font-size: 11px; font-weight: 600; color: var(--muted); padding: 6px 2px 2px; }
      .ev { border-radius: 8px; }
      .ev.now { background: var(--now); }
      .ev.open { background: var(--chip); }
      .ev .evrow { display: flex; align-items: center; gap: 4px; padding-right: 4px; }
      .ev .evhead { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; border: 0; background: transparent;
        padding: 6px 6px; text-align: left; border-radius: 8px; cursor: default; }
      .ev .hora { font: 12px ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; color: var(--muted); flex: none; }
      .ev.now .hora { color: var(--rec-text); font-weight: 600; }
      .ev .tit { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .ev .mark { flex: none; font-size: 11px; color: var(--rec-text); font-weight: 600; }
      .det { padding: 0 8px 8px 8px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
      .det .meta { color: var(--muted); }
      .det label { display: flex; align-items: center; gap: 6px; }
      #bPassados summary { font-size: 11px; font-weight: 600; color: var(--muted); padding: 6px 2px; cursor: default; }
      #bPassados .ev { opacity: 0.7; }
      #bAgendaNota { font-size: 12px; color: var(--muted); }
      #bAgendaNota:empty { display: none; }

      /* chat */
      #chat { flex: none; border-top: 1px solid var(--line); padding: 8px 12px 6px; display: flex; flex-direction: column; gap: 6px; }
      #bChatLog { max-height: 340px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; user-select: text; }
      #bChatLog:empty { display: none; }
      .msg.q { align-self: flex-end; max-width: 85%; background: var(--chip-on); padding: 5px 9px; border-radius: 10px; white-space: pre-wrap; }
      .msg.a { position: relative; padding-right: 22px; }
      .msg.a p { margin: 0 0 5px; } .msg.a ul { margin: 0 0 5px 16px; }
      .msg.a pre { background: var(--chip); padding: 6px 8px; border-radius: 6px; overflow-x: auto; font-size: 11.5px; }
      .msg.a code { font: 11.5px ui-monospace, "SF Mono", Menlo, monospace; }
      .msg.a .copy { position: absolute; right: 0; top: 0; border: 0; background: transparent; color: var(--muted); font-size: 12px; cursor: default; }
      .msg.err { color: var(--rec-text); font-size: 12px; }
      .composer { display: flex; gap: 6px; align-items: flex-end; }
      #bChatIn { resize: none; min-height: 32px; max-height: 96px; font-size: 12.5px; line-height: 1.35; }
      #bChatSend, #bChatStop { flex: none; }
      #chatBar { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--muted); min-height: 16px; }
      /* entrar na reunião, e as tarefas */
      .ev .join { flex: none; padding: 2px 9px; font-size: 11px; }
      .tabbadge { display: inline-block; min-width: 16px; margin-left: 5px; padding: 0 5px; border-radius: 8px;
        background: var(--rec); color: #fff; font-size: 10px; font-weight: 700; line-height: 16px; }
      .tabbadge[hidden] { display: none; }
      #bTarefas, #bConcluidas ul { list-style: none; display: flex; flex-direction: column; gap: 2px; }
      .tk { border-radius: 8px; }
      .tk.open { background: var(--chip); }
      .tk .tkrow { display: flex; align-items: center; gap: 8px; padding: 5px 6px; }
      .tk .tkrow input { flex: none; }
      .tk .tkt { flex: 1; min-width: 0; border: 0; background: transparent; text-align: left; padding: 0; cursor: default;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tk.done .tkt { text-decoration: line-through; color: var(--muted); }
      .tk .prazo { flex: none; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--chip); color: var(--muted); }
      .tk .prazo.late { background: var(--now); color: var(--rec-text); font-weight: 600; }
      .tk .pend { flex: none; font-size: 11px; color: var(--muted); }
      .tk .notas { padding: 0 8px 8px 30px; font-size: 12px; white-space: pre-wrap; word-break: break-word; user-select: text; }
      .tk .notas .lnk { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; cursor: default; font: inherit; }
      .tk .acts { padding: 0 8px 8px 30px; }
      #bConcluidas summary { font-size: 11px; font-weight: 600; color: var(--muted); padding: 6px 2px; cursor: default; }
      #bTarefasNota { font-size: 12px; color: var(--muted); }
      #bTarefasNota:empty { display: none; }
      /* «/» no chat: os comandos e skills, como no terminal do Claude Code */
      #bSlash { list-style: none; max-height: 224px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px;
        background: var(--bg-solid); padding: 4px; }
      #bSlash[hidden] { display: none; }
      #bSlash li { padding: 4px 8px; border-radius: 6px; cursor: default; display: flex; flex-direction: column; }
      #bSlash li[aria-selected="true"] { background: var(--accent); color: var(--bg-solid); }
      #bSlash .sn { font: 600 12px ui-monospace, "SF Mono", Menlo, monospace; }
      #bSlash .sd { font-size: 11px; opacity: 0.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #foot { flex: none; display: flex; justify-content: space-between; padding: 0 10px 8px; }
    </style>
  </head>
  <body>
    <div id="panel" role="dialog" aria-labelledby="bTitle">
      <div id="head">
        <div class="txt">
          <div id="bStatus"><span class="dot"></span><span id="bStatusText" data-i18n>pronto para gravar</span></div>
          <div id="bTitle"></div>
        </div>
        <div id="bTime"></div>
      </div>
      <div id="main">
        <div id="bPrompt" hidden role="alert">
          <p id="bPromptText"></p>
          <div class="row" id="bPromptActs"></div>
        </div>
        <div class="tabs" role="tablist">
          <button role="tab" id="tabBtnRec" aria-selected="true" aria-controls="tabRec" data-i18n>Gravação</button>
          <button role="tab" id="tabBtnAgenda" aria-selected="false" aria-controls="tabAgenda" data-i18n>Agenda</button>
          <button role="tab" id="tabBtnTarefas" aria-selected="false" aria-controls="tabTarefas"><span data-i18n>Tarefas</span><span class="tabbadge" id="bTarefasBadge" hidden></span></button>
        </div>
        <div class="tab" id="tabRec" role="tabpanel" aria-labelledby="tabBtnRec">
          <div>
            <div class="lbl" data-i18n>onde salvar</div>
            <div id="bDest"></div>
          </div>
          <div class="row">
            <button class="btn primary" id="bGravar" data-i18n>Gravar</button>
            <button class="btn primary" id="bEncerrar" hidden data-i18n>Encerrar</button>
            <button class="btn ghost" id="bPausar" hidden data-i18n>Pausar</button>
            <button class="btn ghost" id="bRetomar" hidden data-i18n>Retomar</button>
            <button class="btn ghost" id="bNova" hidden data-i18n>Nova gravação</button>
          </div>
          <div id="bAviso" role="status"></div>
          <div>
            <div class="lbl" data-i18n>agora</div>
            <div id="bTail" aria-live="polite" data-empty="—"></div>
          </div>
        </div>
        <div class="tab" id="tabAgenda" role="tabpanel" aria-labelledby="tabBtnAgenda" hidden>
          <div id="bAgendaNota"></div>
          <ul id="bAgenda"></ul>
          <details id="bPassados" hidden><summary></summary><ul></ul></details>
        </div>
        <div class="tab" id="tabTarefas" role="tabpanel" aria-labelledby="tabBtnTarefas" hidden>
          <div id="bTarefasNota"></div>
          <ul id="bTarefas"></ul>
          <details id="bConcluidas" hidden><summary></summary><ul></ul></details>
        </div>
        <div id="chat">
          <div id="bChatLog" aria-live="polite"></div>
          <ul id="bSlash" role="listbox" hidden></ul>
          <div class="composer">
            <textarea id="bChatIn" rows="1" spellcheck="false" data-i18n-placeholder="Pergunte ao Claude…"></textarea>
            <button class="btn ghost" id="bChatSend" data-i18n>Enviar</button>
            <button class="btn ghost" id="bChatStop" hidden data-i18n>Parar</button>
          </div>
          <div id="chatBar"><span id="bChatState"></span><button class="btn link" id="bChatNova" hidden data-i18n>nova conversa</button></div>
        </div>
        <div id="foot"><button class="btn link" id="bOcultar" data-i18n>Ocultar balão</button><button class="btn link" id="bAbrir" data-i18n>Abrir no Loro</button></div>
      </div>
    </div>
    <button id="icon" aria-label="Loro" aria-expanded="false">
      <img src="loro-icon.png" alt="" />
      <span id="badge" aria-hidden="true"></span>
    </button>
    <script src="i18n.js"></script>
    <script src="fuzzy.js"></script>
    <script src="agenda.js"></script>
    <script src="tarefas.js"></script>
    <script src="bubble-core.js"></script>
    <script src="bubble.js"></script>
  </body>
</html>
