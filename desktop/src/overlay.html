<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Legenda</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; background: transparent; overflow: hidden;
        font-family: -apple-system, system-ui, sans-serif; user-select: none; }
      #cap {
        height: 100vh; display: flex; align-items: center; gap: 12px;
        padding: 14px 20px; border-radius: 16px;
        background: rgba(16, 22, 24, 0.78);
        border: 1px solid rgba(43, 197, 180, 0.18);
        -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
        color: #ece9e2;
      }
      #dot { width: 9px; height: 9px; border-radius: 50%; background: #7d838a; flex: none; }
      #dot.on { background: #ff5d62; }
      #txt { font-size: 19px; line-height: 1.45; overflow: hidden;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
      #txt:empty::before { content: "aguardando fala…"; color: #7d838a; }
    </style>
  </head>
  <body>
    <div id="cap" data-tauri-drag-region>
      <span id="dot"></span>
      <div id="txt"></div>
    </div>
    <script src="overlay.js"></script>
  </body>
</html>
